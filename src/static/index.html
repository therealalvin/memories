<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Engine</title>
    <!-- Video.js for Pannellum 360 Video Streaming -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@7.20.3/dist/video-js.min.css">
    <script src="https://cdn.jsdelivr.net/npm/video.js@7.20.3/dist/video.min.js"></script>
    <!-- Pannellum 360 Photo & Video Sphere Viewer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.video.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Layout */
        .sidebar { width: 330px; background: #1a1a1a; border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; overflow-y: auto; }
        .sidebar h2 { font-size: 20px; margin: 0; color: #3498db; display: flex; align-items: center; gap: 8px; }
        
        .reset-btn { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; transition: background 0.2s; }
        .reset-btn:hover { background: #219150; }

        .filter-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 6px; }
        
        /* Filter Badges & Interactive Sliders */
        .filter-stack { display: flex; flex-direction: column; gap: 10px; }
        .filter-chip { display: flex; flex-direction: column; gap: 6px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 10px 12px; font-size: 13px; }
        .filter-chip.similar { border-color: #9b59b6; background: #2c1e38; }
        .filter-chip.text { border-color: #3498db; background: #1b2a38; }
        .filter-chip.media_type { border-color: #e67e22; background: #33251a; }
        .filter-chip.camera { border-color: #8e44ad; background: #2b1f3d; }
        .filter-chip.similar_date { border-color: #e74c3c; background: #381e1e; }
        .filter-chip.similar_location { border-color: #1abc9c; background: #1a3833; }
        
        .chip-header { display: flex; align-items: center; justify-content: space-between; font-weight: 500; }
        .chip-remove { background: none; border: none; color: #e74c3c; font-weight: bold; font-size: 16px; cursor: pointer; margin-left: 8px; padding: 0 4px; }
        .chip-remove:hover { color: #ff6b6b; }

        .slider-box { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
        .slider-box label { font-size: 11px; color: #ccc; display: flex; justify-content: space-between; }
        .slider-box input[type="range"] { width: 100%; cursor: pointer; accent-color: #3498db; margin: 2px 0; }

        select, input[type="text"], input[type="date"], button { padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        select { width: 100%; cursor: pointer; }

        /* Main Content Layout */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .search-input { flex-grow: 1; }

        /* Progress Bar */
        .progress-box { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 12px 15px; margin-bottom: 20px; display: none; }
        .progress-bar-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { background: #3498db; height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; }

        /* Media Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .card:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 190px; object-fit: cover; display: block; background: #252525; }
        
        .badge { position: absolute; top: 8px; right: 8px; padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.75); }
        .video-badge { background: #e67e22; color: white; }
        .pano-badge { background: #3498db; color: white; }

        .card-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); padding: 12px 8px 6px; font-size: 11px; color: #ddd; display: flex; justify-content: space-between; }

        /* Modal Viewer & Context Panel */
        #modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .modal-body { position: relative; display: flex; justify-content: center; align-items: center; max-width: 90vw; max-height: 65vh; margin-bottom: 15px; }
        #modal-img, #modal-vid, #panorama { max-width: 85vw; max-height: 65vh; border-radius: 6px; }
        #panorama { width: 900px; height: 550px; display:none; }
        
        .modal-context-panel { background: rgba(30, 30, 30, 0.95); border: 1px solid #444; border-radius: 8px; padding: 10px 18px; font-size: 13px; color: #eee; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 85vw; }
        .modal-context-item { display: flex; align-items: center; gap: 6px; }
        .modal-context-item span { color: #3498db; font-weight: bold; }

        .modal-controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .modal-controls button { cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s; }
        .modal-controls button:hover { background: #333; }
        #similar-btn { border-color: #9b59b6; color: #d7bde2; }
        #similar-date-btn { border-color: #e74c3c; color: #f5b7b1; }
        #similar-loc-btn { border-color: #1abc9c; color: #a3e4d7; }

        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); font-size: 24px; padding: 15px 20px; border-radius: 50%; z-index: 1010; cursor: pointer; border: none; color: white; }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }
        #close-btn { position: absolute; top: 20px; right: 20px; background: #e74c3c; font-size: 16px; font-weight: bold; z-index: 1010; cursor: pointer; border: none; padding: 8px 14px; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- Sidebar with Cumulative Filtering Stack -->
    <div class="sidebar">
        <h2>🖼 Memories Engine</h2>

        <button class="reset-btn" onclick="resetFilters()">🔄 RESET / SHOW ALL</button>

        <div>
            <div class="filter-section-title">Sort Order</div>
            <select id="sortBySelect" onchange="executeSearch()">
                <option value="date_desc">📅 Date: Newest First</option>
                <option value="date_asc">📅 Date: Oldest First</option>
                <option value="camera">📷 Camera Model</option>
                <option value="relevance">🎯 Relevance Score</option>
            </select>
        </div>

        <div>
            <div class="filter-section-title">Date Range</div>
            <select id="datePresetSelect" onchange="handleDatePresetChange()">
                <option value="all">🗓 All Time</option>
                <option value="this_week">🗓 This Week</option>
                <option value="this_month">🗓 This Month</option>
                <option value="ytd">🗓 YTD (Year to Date)</option>
                <option value="1_year">🗓 Past 1 Year</option>
                <option value="custom">🗓 Custom Range...</option>
            </select>
            <div id="customDateInputs" style="display:none; margin-top:8px; flex-direction:column; gap:6px;">
                <label style="font-size:11px; color:#aaa;">Start Date
                    <input type="date" id="startDateInput" onchange="executeSearch()" style="width:100%; margin-top:2px;">
                </label>
                <label style="font-size:11px; color:#aaa;">End Date
                    <input type="date" id="endDateInput" onchange="executeSearch()" style="width:100%; margin-top:2px;">
                </label>
            </div>
        </div>

        <div>
            <div class="filter-section-title">Filter by Camera</div>
            <select id="cameraSelect" onchange="addCameraFilter()">
                <option value="">📷 Select Camera...</option>
            </select>
        </div>

        <div>
            <div class="filter-section-title">Media Format</div>
            <select id="mediaTypeSelect" onchange="updateMediaTypeFilter()">
                <option value="all">📁 All Media</option>
                <option value="photos">🖼 Photos Only</option>
                <option value="videos">🎥 Videos Only</option>
            </select>
        </div>

        <div>
            <div class="filter-section-title">Active Filters (Cumulative AND)</div>
            <div id="filterStack" class="filter-stack">
                <div style="color: #666; font-size: 13px;">No filters applied.</div>
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
            <button id="syncBtn" onclick="syncFiles(false)" style="width: 100%;">⚡ Resync / Index Files</button>
            <button id="forceSyncBtn" onclick="syncFiles(true)" style="width: 100%; background: transparent; border: 1px dashed #555; color: #888; font-size: 11px; padding: 5px; cursor: pointer; border-radius: 4px;" title="Forces a fresh metadata and embedding scan for all files">🔄 Force Full Re-index</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by content (e.g., 'softball', 'beach', 'mountain', 'dinner')..." onkeypress="if(event.key === 'Enter') addSearchFilter()">
            <button onclick="addSearchFilter()">🔍 Search</button>
        </div>

        <!-- Sync Progress Bar -->
        <div id="progressBox" class="progress-box">
            <div class="progress-text">
                <span id="progressMessage">Syncing...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Results Grid -->
        <div class="grid" id="mediaGrid"></div>
    </div>

    <!-- Modal Viewer with Context Panel -->
    <div id="modal">
        <button id="close-btn" onclick="closeModal()">✕ Close</button>
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">❮</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">❯</button>
        
        <div class="modal-body">
            <img id="modal-img" style="display:none;">
            <video id="modal-vid" controls style="display:none;"></video>
            <div id="panorama"></div>
        </div>

        <!-- Context Panel -->
        <div class="modal-context-panel" id="modalContextPanel">
            <div class="modal-context-item">📁 <span id="ctxFilename">-</span></div>
            <div class="modal-context-item">📅 <span id="ctxDate">-</span></div>
            <div class="modal-context-item">📷 <span id="ctxCamera">-</span></div>
            <div class="modal-context-item">📍 <span id="ctxLocation">-</span></div>
        </div>

        <div class="modal-controls">
            <button id="similar-btn" onclick="addSimilarFilterCurrent()">🖼 Filter Pictures Like This</button>
            <button id="similar-date-btn" onclick="addSimilarDateFilterCurrent()">📅 Filter Around Same Time</button>
            <button id="similar-loc-btn" onclick="addSimilarLocationFilterCurrent()" style="display:none;">📍 Filter Near Here</button>
        </div>
    </div>

    <script>
        let activeFilters = [];
        let currentMediaList = [];
        let currentIndex = 0;
        let pollInterval = null;
        let panoViewer = null;

        const DATE_STEPS = [
            0.0416, 0.125, 0.25, 0.5, 1.0, 2.0, 3.0, 7.0, 14.0, 30.0, 60.0, 90.0, 180.0, 365.0
        ];

        const DIST_STEPS = [
            0.05, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0, 10.0, 25.0, 50.0, 100.0
        ];

        function formatDaysLabel(days) {
            days = parseFloat(days);
            if (days < (1/24 + 0.001)) return `±1 hour`;
            if (days < 1) return `±${Math.round(days * 24)} hours`;
            if (days <= 1.0) return `±1 day`;
            if (days < 7) return `±${Math.round(days)} days`;
            if (days < 30) return `±${Math.round(days / 7)} weeks`;
            if (days < 365) return `±${Math.round(days / 30)} months`;
            return `±${(days / 365).toFixed(1)} years`;
        }

        function formatRadiusLabel(miles) {
            miles = parseFloat(miles);
            if (miles < 0.2) {
                return `±${Math.round(miles * 5280)} ft`;
            } else if (miles < 1.0) {
                return `±${miles.toFixed(2)} mi (${Math.round(miles * 5280)} ft)`;
            }
            return `±${miles.toFixed(1)} mi`;
        }

        function findNearestStepIndex(val, steps) {
            let bestIdx = 0;
            let bestDiff = Math.abs(steps[0] - val);
            for (let i = 1; i < steps.length; i++) {
                let diff = Math.abs(steps[i] - val);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestIdx = i;
                }
            }
            return bestIdx;
        }

        function handleDatePresetChange() {
            const val = document.getElementById('datePresetSelect').value;
            const customBox = document.getElementById('customDateInputs');
            if (val === 'custom') {
                customBox.style.display = 'flex';
            } else {
                customBox.style.display = 'none';
                executeSearch();
            }
        }

        function getDatePresetRange() {
            const preset = document.getElementById('datePresetSelect').value;
            if (preset === 'all') {
                return { start_date: null, end_date: null };
            }

            const now = new Date();
            let start = null;
            let end = null;

            if (preset === 'this_week') {
                const d = new Date(now);
                const day = d.getDay(); // 0 is Sunday
                const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Start Monday
                start = new Date(d.setDate(diff));
                end = now;
            } else if (preset === 'this_month') {
                start = new Date(now.getFullYear(), now.getMonth(), 1);
                end = now;
            } else if (preset === 'ytd') {
                start = new Date(now.getFullYear(), 0, 1);
                end = now;
            } else if (preset === '1_year') {
                start = new Date(now);
                start.setFullYear(now.getFullYear() - 1);
                end = now;
            } else if (preset === 'custom') {
                const sVal = document.getElementById('startDateInput').value;
                const eVal = document.getElementById('endDateInput').value;
                return { start_date: sVal || null, end_date: eVal || null };
            }

            const formatDate = (dObj) => {
                if (!dObj) return null;
                const y = dObj.getFullYear();
                const m = String(dObj.getMonth() + 1).padStart(2, '0');
                const d = String(dObj.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            };

            return {
                start_date: formatDate(start),
                end_date: formatDate(end)
            };
        }

        async function loadCameraDropdown() {
            try {
                const res = await fetch('/api/cameras');
                const cameras = await res.json();
                const select = document.getElementById('cameraSelect');
                select.innerHTML = '<option value="">📷 Select Camera...</option>';
                cameras.forEach(cam => {
                    const opt = document.createElement('option');
                    opt.value = cam;
                    opt.textContent = cam;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to load camera list", e);
            }
        }

        function addCameraFilter() {
            const select = document.getElementById('cameraSelect');
            const cam = select.value;
            if (!cam) return;

            activeFilters = activeFilters.filter(f => f.type !== 'camera');

            activeFilters.push({
                id: 'filter_' + Date.now(),
                type: 'camera',
                value: cam,
                label: `Camera: ${cam}`
            });

            select.value = '';
            executeSearch();
        }

        function renderFilterStack() {
            const container = document.getElementById('filterStack');
            container.innerHTML = '';

            if (activeFilters.length === 0) {
                container.innerHTML = '<div style="color: #666; font-size: 13px;">No filters applied. Showing all items.</div>';
                return;
            }

            activeFilters.forEach(filter => {
                const chip = document.createElement('div');
                chip.className = `filter-chip ${filter.type}`;

                let innerHTML = `
                    <div class="chip-header">
                        <span>${filter.label}</span>
                        <button class="chip-remove" title="Remove filter" onclick="removeFilter('${filter.id}')">✕</button>
                    </div>
                `;

                if (filter.type === 'similar_date') {
                    const stepIdx = findNearestStepIndex(filter.days, DATE_STEPS);
                    innerHTML += `
                        <div class="slider-box">
                            <label>Time Window: <strong>${formatDaysLabel(filter.days)}</strong></label>
                            <input type="range" min="0" max="${DATE_STEPS.length - 1}" step="1" value="${stepIdx}" 
                                onchange="updateDateSliderStep('${filter.id}', this.value)" 
                                oninput="this.previousElementSibling.querySelector('strong').textContent = formatDaysLabel(DATE_STEPS[this.value])">
                        </div>
                    `;
                } else if (filter.type === 'similar_location') {
                    const stepIdx = findNearestStepIndex(filter.radius_miles, DIST_STEPS);
                    innerHTML += `
                        <div class="slider-box">
                            <label>Distance Radius: <strong>${formatRadiusLabel(filter.radius_miles)}</strong></label>
                            <input type="range" min="0" max="${DIST_STEPS.length - 1}" step="1" value="${stepIdx}" 
                                onchange="updateLocationSliderStep('${filter.id}', this.value)" 
                                oninput="this.previousElementSibling.querySelector('strong').textContent = formatRadiusLabel(DIST_STEPS[this.value])">
                        </div>
                    `;
                } else if (filter.type === 'similar') {
                    const pct = Math.round((filter.threshold || 0.50) * 100);
                    innerHTML += `
                        <div class="slider-box">
                            <label>Visual Similarity: <strong>${pct}%</strong></label>
                            <input type="range" min="30" max="90" step="1" value="${pct}" 
                                onchange="updateSimilaritySlider('${filter.id}', this.value)" 
                                oninput="this.previousElementSibling.querySelector('strong').textContent = this.value + '%'">
                        </div>
                    `;
                }

                chip.innerHTML = innerHTML;
                container.appendChild(chip);
            });
        }

        async function executeSearch() {
            renderFilterStack();
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = "<p style='color: #888;'>Loading media...</p>";

            const sortBy = document.getElementById('sortBySelect').value;
            const dateRange = getDatePresetRange();

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        filters: activeFilters, 
                        sort_by: sortBy,
                        start_date: dateRange.start_date,
                        end_date: dateRange.end_date
                    })
                });

                const data = await res.json();
                currentMediaList = data;
                grid.innerHTML = "";

                if (data.length === 0) {
                    grid.innerHTML = "<p style='color: #888; grid-column: 1/-1;'>No media found matching all active filters.</p>";
                    return;
                }

                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(index);
                    
                    const dateText = item.date ? item.date.split(' ')[0] : '';
                    const cameraText = item.camera && item.camera !== 'Unknown' ? item.camera : '';
                    const fname = (item.filename || '').toLowerCase();
                    
                    let badgeHtml = '';
                    if (fname.endsWith('.insp') || item.type === '360_photo') {
                        badgeHtml = '<span class="badge pano-badge">🌐 360° Photo</span>';
                    } else if (fname.endsWith('.insv')) {
                        badgeHtml = '<span class="badge pano-badge">🌐 360° Video</span>';
                    } else if (item.type === 'video') {
                        badgeHtml = '<span class="badge video-badge">🎥 Video</span>';
                    }

                    card.innerHTML = `
                        <img src="/api/thumbnail/${item.id}" loading="lazy" alt="${item.filename}">
                        ${badgeHtml}
                        <div class="card-info">
                            <span>${dateText}</span>
                            <span>${cameraText}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                grid.innerHTML = `<p style='color: #e74c3c;'>Search error: ${e}</p>`;
            }
        }

        function updateDateSliderStep(filterId, stepIndex) {
            const filter = activeFilters.find(f => f.id === filterId);
            if (filter) {
                filter.days = DATE_STEPS[parseInt(stepIndex)];
                executeSearch();
            }
        }

        function updateLocationSliderStep(filterId, stepIndex) {
            const filter = activeFilters.find(f => f.id === filterId);
            if (filter) {
                filter.radius_miles = DIST_STEPS[parseInt(stepIndex)];
                executeSearch();
            }
        }

        function updateSimilaritySlider(filterId, pctValue) {
            const filter = activeFilters.find(f => f.id === filterId);
            if (filter) {
                filter.threshold = parseFloat(pctValue) / 100.0;
                executeSearch();
            }
        }

        function addSearchFilter() {
            const input = document.getElementById('searchInput');
            const val = input.value.trim();
            if (!val) return;

            activeFilters.push({
                id: 'filter_' + Date.now(),
                type: 'text',
                value: val,
                label: `Search: "${val}"`
            });

            document.getElementById('sortBySelect').value = 'relevance';
            input.value = '';
            executeSearch();
        }

        function addSimilarFilterCurrent() {
            if (currentMediaList.length === 0) return;
            const item = currentMediaList[currentIndex];
            closeModal();

            // Replace any existing similar picture filter
            activeFilters = activeFilters.filter(f => f.type !== 'similar');

            activeFilters.push({
                id: 'filter_' + Date.now(),
                type: 'similar',
                value: String(item.id),
                threshold: 0.50,
                label: `Like: ${item.filename}`
            });

            document.getElementById('sortBySelect').value = 'relevance';
            executeSearch();
        }

        async function addSimilarDateFilterCurrent() {
            if (currentMediaList.length === 0) return;
            const item = currentMediaList[currentIndex];
            closeModal();

            const dateLabel = item.date ? item.date.split(' ')[0] : `Photo #${item.id}`;

            // Replace any existing similar date filter
            activeFilters = activeFilters.filter(f => f.type !== 'similar_date');

            activeFilters.push({
                id: 'filter_' + Date.now(),
                type: 'similar_date',
                value: String(item.id),
                days: 7.0,
                label: `Time near ${dateLabel}`
            });

            executeSearch();
        }

        async function addSimilarLocationFilterCurrent() {
            if (currentMediaList.length === 0) return;
            const item = currentMediaList[currentIndex];

            const res = await fetch(`/api/media_details/${item.id}`);
            const details = await res.json();

            if (details.lat === null || details.lat === undefined || details.lon === null || details.lon === undefined) {
                alert(`"${details.filename}" does not contain GPS location metadata.`);
                return;
            }

            closeModal();

            const locLabel = `${details.lat.toFixed(3)}°, ${details.lon.toFixed(3)}°`;

            // Replace any existing similar location filter
            activeFilters = activeFilters.filter(f => f.type !== 'similar_location');

            activeFilters.push({
                id: 'filter_' + Date.now(),
                type: 'similar_location',
                value: String(item.id),
                radius_miles: 5.0,
                label: `Near (${locLabel})`
            });

            executeSearch();
        }

        function updateMediaTypeFilter() {
            const val = document.getElementById('mediaTypeSelect').value;
            activeFilters = activeFilters.filter(f => f.type !== 'media_type');
            
            if (val !== 'all') {
                activeFilters.push({
                    id: 'filter_' + Date.now(),
                    type: 'media_type',
                    value: val,
                    label: `Format: ${val}`
                });
            }
            executeSearch();
        }

        function removeFilter(filterId) {
            const removed = activeFilters.find(f => f.id === filterId);
            activeFilters = activeFilters.filter(f => f.id !== filterId);
            
            if (removed && removed.type === 'media_type') {
                document.getElementById('mediaTypeSelect').value = 'all';
            }
            
            executeSearch();
        }

        function resetFilters() {
            activeFilters = [];
            document.getElementById('searchInput').value = '';
            document.getElementById('mediaTypeSelect').value = 'all';
            document.getElementById('cameraSelect').value = '';
            document.getElementById('sortBySelect').value = 'date_desc';
            document.getElementById('datePresetSelect').value = 'all';
            document.getElementById('customDateInputs').style.display = 'none';
            document.getElementById('startDateInput').value = '';
            document.getElementById('endDateInput').value = '';
            executeSearch();
        }

        async function openModal(index) {
            currentIndex = index;
            await renderModalItem();
            document.getElementById('modal').style.display = 'flex';
        }

        async function renderModalItem() {
            if (currentMediaList.length === 0) return;
            const item = currentMediaList[currentIndex];
            
            const img = document.getElementById('modal-img');
            const vid = document.getElementById('modal-vid');
            const pano = document.getElementById('panorama');
            const locBtn = document.getElementById('similar-loc-btn');
            const locSpan = document.getElementById('ctxLocation');

            img.style.display = 'none'; 
            vid.style.display = 'none'; 
            pano.style.display = 'none';
            vid.pause();

            locBtn.style.display = 'none';
            locSpan.textContent = 'Loading...';
            locSpan.style.cursor = 'default';
            locSpan.style.textDecoration = 'none';
            locSpan.title = '';
            locSpan.onclick = null;

            if (panoViewer) {
                try {
                    panoViewer.destroy();
                } catch (e) {}
                panoViewer = null;
            }
            pano.innerHTML = '';

            const filename = (item.filename || '').toLowerCase();
            const isInsp = filename.endsWith('.insp');
            const isInsv = filename.endsWith('.insv');
            const is360Photo = item.type === '360_photo' || isInsp;

            // Interactive sphere projection for .insv (videos) and .insp / 360 photos
            if (isInsv) {
                pano.style.display = 'block';

                // Explicit video element setup for Firefox WebGL video texture streaming
                pano.innerHTML = `
                    <video id="pano-video-player" class="video-js vjs-default-skin" controls preload="auto" crossorigin="anonymous" playsinline style="width:100%; height:100%;">
                        <source src="/media/${item.id}" type="video/mp4">
                    </video>
                `;

                // Initialize Pannellum video plugin with Firefox WebGL CORS texture compatibility parameters
                try {
                    if (typeof pannellum !== 'undefined' && pannellum.video) {
                        panoViewer = pannellum.video('pano-video-player', {
                            type: 'equirectangular',
                            autoplay: true,
                            showZoomCtrl: true,
                            cors: true,
                            mouseZoom: true,
                            draggable: true
                        });
                    } else if (window.videojs) {
                        const vPlayer = videojs('pano-video-player');
                        vPlayer.play();
                    }
                } catch (err) {
                    console.warn("Firefox WebGL 360 Video initialisation error:", err);
                }
            } else if (is360Photo) {
                pano.style.display = 'block';
                panoViewer = pannellum.viewer('panorama', {
                    "type": "equirectangular",
                    "panorama": `/media/${item.id}`,
                    "autoLoad": true,
                    "mouseZoom": true,
                    "draggable": true
                });
            } else if (item.type === 'video') {
                vid.style.display = 'block';
                vid.src = `/media/${item.id}`;
                vid.play();
            } else {
                img.style.display = 'block';
                img.src = `/media/${item.id}`;
            }

            try {
                const res = await fetch(`/api/media_details/${item.id}`);
                const details = await res.json();

                document.getElementById('ctxFilename').textContent = details.filename || item.filename || '-';
                document.getElementById('ctxDate').textContent = details.date || 'Unknown';
                document.getElementById('ctxCamera').textContent = details.camera || 'Unknown';
                
                if (details.lat !== null && details.lat !== undefined && details.lon !== null && details.lon !== undefined) {
                    locBtn.style.display = 'inline-block';
                    locSpan.textContent = `${details.lat.toFixed(4)}°, ${details.lon.toFixed(4)}°`;
                    locSpan.style.cursor = 'pointer';
                    locSpan.style.textDecoration = 'underline';
                    locSpan.title = 'Click to open in Google Maps';
                    locSpan.onclick = () => {
                        window.open(`https://www.google.com/maps?q=${details.lat},${details.lon}`, '_blank');
                    };
                } else {
                    locBtn.style.display = 'none';
                    locSpan.textContent = 'No GPS Data';
                    locSpan.style.cursor = 'default';
                    locSpan.style.textDecoration = 'none';
                    locSpan.title = '';
                    locSpan.onclick = null;
                }
            } catch (e) {
                console.error("Failed to load details for modal context", e);
            }
        }

        function navigate(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = currentMediaList.length - 1;
            if (currentIndex >= currentMediaList.length) currentIndex = 0;
            renderModalItem();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-vid').pause();
            if (panoViewer) {
                try {
                    panoViewer.destroy();
                } catch (e) {}
                panoViewer = null;
            }
            document.getElementById('panorama').innerHTML = '';
        }

        async function syncFiles(force = false) {
            const btn = document.getElementById('syncBtn');
            const forceBtn = document.getElementById('forceSyncBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Syncing...';
            }
            if (forceBtn) forceBtn.disabled = true;

            const box = document.getElementById('progressBox');
            const message = document.getElementById('progressMessage');
            const percentText = document.getElementById('progressPercent');
            const fill = document.getElementById('progressBarFill');

            box.style.display = 'block';
            fill.style.background = '#3498db';
            fill.style.width = '3%';
            message.textContent = force ? 'Starting full re-index...' : 'Scanning directories...';
            percentText.textContent = '0%';

            try {
                const url = force ? '/api/sync?force=true' : '/api/sync';
                const res = await fetch(url, { method: 'POST' });
                const json = await res.json();
                console.log("Sync trigger response:", json);
            } catch (err) {
                console.error("Failed to trigger sync:", err);
                message.textContent = 'Failed to start sync: ' + err;
                fill.style.background = '#e74c3c';
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '⚡ Resync / Index Files';
                }
                if (forceBtn) forceBtn.disabled = false;
                return;
            }

            startProgressPolling();
        }

        function startProgressPolling() {
            const box = document.getElementById('progressBox');
            const message = document.getElementById('progressMessage');
            const percentText = document.getElementById('progressPercent');
            const fill = document.getElementById('progressBarFill');
            const btn = document.getElementById('syncBtn');
            const forceBtn = document.getElementById('forceSyncBtn');

            box.style.display = 'block';
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Syncing...';
            }
            if (forceBtn) forceBtn.disabled = true;

            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/sync/status');
                    const data = await res.json();

                    message.textContent = data.message || 'Syncing...';

                    let pct = 0;
                    if (data.percent !== undefined && data.percent !== null) {
                        pct = data.percent;
                    } else if (data.total > 0) {
                        pct = Math.round((data.current / data.total) * 100);
                    }
                    pct = Math.min(100, Math.max(0, pct));

                    fill.style.width = pct + '%';

                    if (data.phase === 'scanning' || data.phase === 'analyzing') {
                        percentText.textContent = data.current > 0 ? `${data.current} files` : `${pct}%`;
                    } else if (data.total > 0) {
                        percentText.textContent = `${pct}% (${data.current}/${data.total})`;
                    } else {
                        percentText.textContent = `${pct}%`;
                    }

                    if (!data.running) {
                        clearInterval(pollInterval);
                        pollInterval = null;

                        if (btn) {
                            btn.disabled = false;
                            btn.textContent = '⚡ Resync / Index Files';
                        }
                        if (forceBtn) forceBtn.disabled = false;

                        if (data.phase === 'error') {
                            fill.style.background = '#e74c3c';
                            message.style.color = '#e74c3c';
                            percentText.textContent = 'Error';
                            setTimeout(() => {
                                box.style.display = 'none';
                                fill.style.background = '#3498db';
                                message.style.color = '#ccc';
                            }, 8000);
                        } else {
                            fill.style.width = '100%';
                            fill.style.background = '#2ecc71';
                            percentText.textContent = '100%';
                            setTimeout(() => {
                                box.style.display = 'none';
                                fill.style.background = '#3498db';
                                loadCameraDropdown();
                                executeSearch();
                            }, 1800);
                        }
                    }
                } catch (e) {
                    console.error("Sync polling error:", e);
                }
            }, 400);
        }

        async function checkInitialSyncStatus() {
            try {
                const res = await fetch('/api/sync/status');
                const data = await res.json();
                if (data.running) {
                    startProgressPolling();
                }
            } catch (e) {}
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('modal').style.display === 'flex') {
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
                if (e.key === 'Escape') closeModal();
            }
        });

        loadCameraDropdown();
        executeSearch();
        checkInitialSyncStatus();
    </script>
</body>
</html>
